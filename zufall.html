<!DOCTYPE html>
<html lang="de">

        <meta charset="utf-8">

    <body>
          <!-- Header der Seite -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <a class="navbar-brand" href="#">Würfel </a>
            <a class="btn btn-primary" href="https://marcscheidegger.ch" role="button">Home</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <button class="btn btn-outline-primary m-1 mt-3" id="nav1" type="button">Stammton-Würfel</button>
                    <button class="btn btn-outline-warning m-1 mt-3" id="nav2" type="button">Chromatik-Würfel</button>
                    <button class="btn btn-outline-success m-1 mt-3" id="nav3" type="button">Akkorde 1. Lage</button>
                    <button class="btn btn-outline-danger m-1 mt-3" id="nav4" type="button">CAGED Akkorde</button>
                </div>
            </div>
        </nav>
        <div class="alert alert-primary m-3" role="alert">
            Wähle deinen Würfel im Menu! Viel Spass!!!
        </div>
        <!-- Karten mit den einzelnen Zufallsgeneratoren-->
        <!-- 1. Stammtöne-->
        <div class="card border-primary m-3 mw-100 card-schmal" id="card1" style="display: none">
            <h5 class="card-header">Stammton-Würfel</h5>
            <div class="card-body" id="stammtonW">
                <button id="stammButtonW" type="button" class="btn btn-primary">Würfel</button>
                <p class="card-text pt-3" id="stTone"></p>
                
            </div>
            
        </div>
        <!-- 2. Chromatik-->
        <div class="card border-warning m-3 mw-100" id="card2" style="display: none">
                <h5 class="card-header">Chromatik-Würfel</h5>
                <div class="card-body" id="chromatikW">
                    <button id="chromButtonW" type="button" class="btn btn-warning">Würfel</button>
                    <p class="card-text pt-3" id="chTone"></p>
                </div>
        </div>
        <!-- 3. Die Akkorde der 1. Lage CAGEFD B7 Bm7 -->
        <div class="card border-success m-3 mw-100" style="display: none" id="card3">
            <h5 class="card-header">Würfel Akkorde der 1. Lage</h5>
            <div class="card-body" id="akkordeLage1W">
                <button id="akkLage1ButtonW" type="button" class="btn btn-success">Würfel</button>
                <h3 class="card-title pt-3" id="akkLeins"></h3>
                <button id="zeigImg" type="button" class="btn btn-outline-dark btn-sm">Griff</button>
                <div class="pt-3">
                    <img src="#" id="imgAkk" class="img-fluid" alt="Akkord Bild" style="display: none ">
                </div>
            </div>
        </div>
        <!--4. CAGED System Akkorde Dur Moll 7 m7 CAGEFD AmEmDm-->  
        <div class="card border-danger m-3 mw-100" style="display: none" id="card4">
            <h5 class="card-header">CAGED Akkorde Würfel</h5>
            <div class="card-body" id="cagedAkkW">
                <button id="cagedButtonW" type="button" class="btn btn-danger">Würfel</button> 
                <h3 class="card-text pt-3" id="cagedText"></h3>
                <button id="zeigImg2" type="button" class="btn btn-outline-dark btn-sm">Griff</button>
                <div class="pt-3"></div>
                    <img src="#" id="imgCaged" class="img-fluid" alt="CAGED Akkord-Form Griffbild" style="display: none">
                </div>
             </div>
        </div>
