<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="utf-8">
        <title>Akkord-Griffbilder (Entwurf) – Marc Scheidegger</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="robots" content="noindex">
        <link rel="icon" href="favicon.svg" type="image/svg+xml">
        <link rel="stylesheet" href="marke.css?v=2">
        <link rel="stylesheet" href="zufall.css?v=1">
        <style>
            /* Nur für diese Entwurfsseite */
            .bogen { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
            .griffkarte { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
            .griffkarte svg { display: block; width: 100%; height: auto; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line); }
            .aktionen { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
            .aktionen button {
                font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; padding: 6px 12px; border-radius: 999px;
                background: transparent; color: var(--ink); border: 1px solid var(--line);
            }
            .aktionen button:hover { border-color: var(--ms-yellow); }
        </style>
    </head>
    <body>
        <main class="screen">
            <div class="tool-head">
                <span class="kicker">Entwurf</span>
                <h1>Akkorde der 1. Lage</h1>
                <p class="hint">Griffbilder als SVG statt Fotos. Grundton gelb, hohe e-Saite oben, Sattel links.
                Jedes Bild lässt sich als PNG speichern, kopieren oder (iPad/iPhone) direkt in eine Notiz-App teilen.</p>
            </div>
            <div class="bogen" id="bogen"></div>
        </main>

        <script src="akkorde.js?v=2"></script>
        <script>
            var bogen = document.getElementById("bogen");
            var teilen = akkordTeilenMoeglich();
            Object.keys(AKKORDE).forEach(function (name) {
                var karte = document.createElement("div");
                karte.className = "griffkarte";
                karte.innerHTML = akkordSvg(name) +
                    '<div class="aktionen">' +
                    '<button type="button" data-tun="speichern">Bild speichern</button>' +
                    '<button type="button" data-tun="kopieren">Kopieren</button>' +
                    (teilen ? '<button type="button" data-tun="teilen">Teilen</button>' : '') +
                    '</div>';
                karte.querySelector('[data-tun="speichern"]').onclick = function () { akkordSpeichern(name); };
                karte.querySelector('[data-tun="kopieren"]').onclick = function () { akkordKopieren(name, this); };
                if (teilen) karte.querySelector('[data-tun="teilen"]').onclick = function () { akkordTeilen(name); };
                bogen.appendChild(karte);
            });
        </script>
    </body>
</html>
